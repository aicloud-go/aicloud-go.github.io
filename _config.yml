# ==========================================
# 《地球人危機》小說網站設定
# ==========================================
title: 地球人危機
tagline: 原創科幻危機連載小說
description: 當外星人與未來人展開跨越星海與時間線的「頂上對決」，身處夾縫中的地球人該如何守住最後防線？原創連載小說《地球人危機》官方閱讀站。
author:
  name: Aicloud
  bio: 原創連載中｜科幻・危機・懸疑

# GitHub Pages 網址設定（對應 https://aicloud-go.github.io）
url: "https://aicloud-go.github.io"
baseurl: ""

lang: zh-Hant-TW
timezone: Asia/Taipei

# 確保所有章節都能即時發布，不會因伺服器時區差異被隱藏
future: true

# 章節網址格式
permalink: /chapters/:year-:month-:day-:title/

# Markdown 設定
markdown: kramdown
kramdown:
  input: GFM

# GitHub Pages 原生支援外掛（自動生成 SEO 與 RSS）
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 預設套用的版型
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "page"

# 排除不需要發布到網站的檔案
exclude:
  - preview.html
  - README.md
